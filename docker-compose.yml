services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - experiments:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    # Native host gem5 simulates X86; workloads use an explicit x86 cross compiler.
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        BUILD_JOBS: ${BUILD_JOBS:-2}
    environment:
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      SIMULATION_TIMEOUT_SECONDS: ${SIMULATION_TIMEOUT_SECONDS:-120}
    volumes:
      - experiments:/data
    depends_on:
      backend:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, python, -c, "import json,time; d=json.load(open('/data/worker.json')); assert 0 <= time.time()-d['timestamp'] < 10"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  experiments:
